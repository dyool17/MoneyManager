name: Windows release

# Builds the Windows installer (NSIS) on a real Windows runner.
# - Publishing a GitHub release attaches the installer to it.
# - Running it by hand without a tag is a dry run: the installer is kept as a
#   workflow artifact so the build can be checked before a release exists.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the installer to (leave empty for a dry run)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Frontend tests
        run: pnpm test

      - name: Native tests
        working-directory: app/src-tauri
        run: cargo test

      # MSI (WiX) rejects pre-release versions such as 0.1.0-beta.2; NSIS accepts them.
      - name: Build installer
        run: pnpm tauri build --bundles nsis

      - name: Collect installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $name = "MoneyManager_${version}_x64-setup.exe"
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Copy-Item $exe.FullName "dist-release/$name"
          $hash = (Get-FileHash "dist-release/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "dist-release/SHA256SUMS-windows.txt"
          Get-Content "dist-release/SHA256SUMS-windows.txt"

      - name: Keep installer as artifact (dry run)
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: app/dist-release/*

      - name: Attach installer to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:TAG" (Get-ChildItem dist-release/*).FullName --clobber
        shell: pwsh
